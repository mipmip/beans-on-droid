name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # A tag that disagrees with VERSION would publish an artefact whose
      # name and contents do not match.
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "$file" ]]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $file" >&2
            exit 1
          fi
          echo "version=$file" >> "$GITHUB_ENV"

      - name: Gate
        run: ./scripts/gate.sh

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "no signing key configured; refusing to publish an unsigned release" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          BEANS_KEYSTORE: ${{ runner.temp }}/release.jks
          BEANS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BEANS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BEANS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: nix develop --command ./gradlew assembleRelease

      - name: Name it and checksum it
        run: |
          src="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$src" ]]; then
            echo "expected a signed APK at $src; found:" >&2
            ls -la app/build/outputs/apk/release/ >&2
            exit 1
          fi
          mkdir -p dist
          cp "$src" "dist/beans-on-droid-${version}.apk"
          (cd dist && sha256sum "beans-on-droid-${version}.apk" > "beans-on-droid-${version}.apk.sha256")

      - name: Release notes
        run: |
          code=$(( $(cut -d. -f1 VERSION) * 1000000
                 + $(cut -d. -f2 VERSION) * 10000
                 + $(cut -d. -f3 VERSION) * 100 ))
          notes="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          if [[ -f "$notes" ]]; then
            cp "$notes" dist/notes.md
          else
            echo "Release ${version}." > dist/notes.md
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/beans-on-droid-${{ env.version }}.apk
            dist/beans-on-droid-${{ env.version }}.apk.sha256
          body_path: dist/notes.md
          fail_on_unmatched_files: true

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
